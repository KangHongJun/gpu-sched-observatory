[project]
name = "gso"
version = "0.0.1"
description = "GPU Scheduling Observatory: GPU contention viewer (context switches, kernel overlap, CUDA MPS effects)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "nvidia-ml-py>=12.535",
    "textual>=0.60",
]

[project.scripts]
gso = "gso.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.5.0",
    "ruff",
]
bench = ["torch", "torchvision", "numpy", "onnx", "tensorrt-cu13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gso"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
